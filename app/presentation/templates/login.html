{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:400px;margin:2rem auto;">
  <h2>Login</h2>
  <form method="post" id="loginForm">
    <label>Email</label><input name="email" type="email" required>
    <label>Password</label><input name="password" type="password" required>
    <br><br>
    <button class="btn" type="submit">Login</button>
  </form>
  <p>No account? <a href="{{ url_for('auth.register') }}">Register</a></p>
  <div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
    <button type="button" class="btn btn-secondary" onclick="fill('admin@care.com','admin123')">Admin demo</button>
    <button type="button" class="btn btn-secondary" onclick="fill('nimal@care.com','pass123')">Seeker demo</button>
    <button type="button" class="btn btn-secondary" onclick="fill('rohan@care.com','pass123')">Volunteer demo</button>
  </div>
  <script>function fill(e,p){document.querySelector('input[name=email]').value=e;document.querySelector('input[name=password]').value=p;document.getElementById('loginForm').submit();}</script>
</div>
{% endblock %}
