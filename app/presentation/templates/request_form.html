{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>New Help Request</h2>
  <form method="post">
    <label>Title</label><input name="title" required>
    <label>Description</label><textarea name="description" rows="3"></textarea>
    <div class="row">
      <div class="col"><label>Category</label>
        <select name="category"><option>groceries</option><option>driving</option><option>tech</option><option>forms</option><option>general</option></select></div>
      <div class="col"><label>Urgency</label>
        <select name="urgency"><option value="low">Low</option><option value="normal" selected>Normal</option><option value="high">High</option></select></div>
      <div class="col"><label>Location</label><input name="location" value="{{ current_user.location }}"></div>
    </div>
    <br>
    <button class="btn" type="submit">Submit</button>
  </form>
</div>
{% endblock %}
